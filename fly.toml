app = "kismet"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "Kısmet"
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/database/database.sqlite"
  SESSION_DRIVER = "file"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "kismet_storage"
  destination = "/var/www/html/storage"
  initial_size = "1gb"
  processes = ["app"]

[[mounts]]
  source = "kismet_database"
  destination = "/var/www/html/database"
  initial_size = "1gb"
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
